version: '3.9'

# ── AI Interview Coach — Docker Compose ───────────────────────
# Usage:
#   1. Copy server/.env.example → server/.env  and fill in keys
#   2. Copy client/.env.example → client/.env  (or leave defaults)
#   3. docker compose up --build
#
# Services:
#   bot-server  — Python/Pipecat bot + config API (ports 7860, 7861)
#   client      — Vite dev server / Nginx static (port 5173 / 80)

services:

  # ── Pipecat bot server ────────────────────────────────────────
  bot-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: interview-coach-bot
    env_file:
      - ./server/.env
    ports:
      - "7860:7860"   # Pipecat bot / WebRTC signalling
      - "7861:7861"   # Config API
    environment:
      - CONFIG_SERVER_HOST=0.0.0.0
      - CONFIG_SERVER_PORT=7861
      - ALLOWED_ORIGINS=*
    volumes:
      # Hot-reload config file without rebuilding
      - ./server/interview_config.json:/app/interview_config.json
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7861/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── Frontend (Vite dev server) ────────────────────────────────
  client:
    image: node:20-alpine
    container_name: interview-coach-client
    working_dir: /app
    volumes:
      - ./client:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_BOT_START_URL=http://localhost:7860/start
      - VITE_CONFIG_SERVER_URL=http://localhost:7861
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      bot-server:
        condition: service_healthy
    restart: unless-stopped
